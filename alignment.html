<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Alignment</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding: 20px;
                margin: 30px;
                margin-left: 20px;
            }
            #box, #box2{
                width:75px;
                height:75px;
                background-color:blue;
                color:azure;
                text-align: center;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 200px 1fr;
                gap: 5px;
            }
            #flex-wrapper{
                display: none;
                display: flex;
                flex-direction: reverse;
                justify-content: space-between;
                flex-wrap: wrap;
                align-items: center;
            }
            #rabbit{
                width: 150px;
            }
        </style>
    </head>
    <body>
        <h1>Alignment Notes</h1>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbExO5O6na8dOQ27gGBGITVBJFk2iamnFEQWU-HLfBpg&s" alt="rabbit" id="rabbit" onmouseout="changeImage()">
    <div id="box-wrapper">
        <div id="box" onmouseover="disapear()" onmouseout="appear()">
            <p>Box 1</p>
        </div>
        <div id="box2">
            <p>Box 2</p>
        </div>
        <div id="box">
            <p>Box 3</p>
        </div>
        <div id="box">
            <p>Box 4</p>
        </div>
    </div>
    <div id="flex-wrapper">
        <div id="box">
            <p>Box 1</p>
        </div>
        <div id="box">
            <p>Box 2</p>
        </div>
        <div id="box">
            <p>Box 3</p>
        </div>
        <div id="box">
            <p>Box 4</p>
        </div>
    </div>
    <input type="color" id="colorPicker">
    <br>
        <button onClick="color()">Click Me</button>
        <button id="showMore" onClick="show()">Show More</button>
        <script>
            let images = ["https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbExO5O6na8dOQ27gGBGITVBJFk2iamnFEQWU-HLfBpg&s", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqIQpZZTlPGphmZjvdQlHYcwaVk5VvcM0gIyAuc0aVmA&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2Qp6_yqroIBufvKPawNln4WRgq6Zm2rbf2hlJa6oLqw&s=10", "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-G5YwjTlbQiokrHlZVNSATMsDjIqSaoAcVgIzysmCwg&s"]
            let current = 0 
            function changeImage(){
                current += 1;
                if (current > 3){
                    current = 0;
                }
                document.getElementById("rabbit").src = images[current]
            }
            function color(){
                let newColor = document.getElementById("colorPicker").value 
                document.getElementById("box").style.backgroundColor = newColor
            }
            function disapear(){
                document.getElementById("box2").style.display = 'none'
            }
            function appear(){
                document.getElementById("box2").style.display = "block"
            }
            function show(){
                let element = document.getElementById("flex-wrapper")
                if (element.style.display == "flex"){
                    element.style.display = "none"
                    document.getElementById("showMore").innerHTML = "Show More"
                }else{
                    element.syle.display = "flex"
                    document.getElementById("showMore").innerHTML = "Show Less"
                }   
            }
        </script>
    </body>
</html>
