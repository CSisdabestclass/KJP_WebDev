<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Alignment</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding: 20px;
                margin: 30px;
                margin-left: 20px;
            }
            #box{
                width:75px;
                height:75px;
                background-color:blue;
                color:azure;
                text-align: center;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 200px 1fr;
                gap: 5px;
            }
            #flex-wrapper{
                display: flex;
                flex-direction: reverse;
                justify-content: space-between;
                flex-wrap: wrap;
                align-items: center;
                
            }
        </style>
    </head>
    <body>
        <h1>Alignment Notes</h1>
    <div id="box-wrapper">
        <div id="box">
            <p>Box 1</p>
        </div>
        <div id="box">
            <p>Box 2</p>
        </div>
        <div id="box">
            <p>Box 3</p>
        </div>
        <div id="box">
            <p>Box 4</p>
        </div>
    </div>
    <div id="flex-wrapper">
        <div id="box">
            <p>Box 1</p>
        </div>
        <div id="box">
            <p>Box 2</p>
        </div>
        <div id="box">
            <p>Box 3</p>
        </div>
        <div id="box">
            <p>Box 4</p>
        </div>
    </div>
    <button>Click Me</button>
    </body>
</html>
