<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Advanced HTML Notes</title>
        <meta charset="UTF-8">    
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">
        <style>
            body{
                color:dimgrey;
                font-family: "Henny Penny", system-ui;
                font-weight: 400;
                font-style: normal;
            }
            #even{ 
                color:hsl(221, 55%, 40%);
                font-weight: 600; 
            }

            ul{
                background-color: rgba(255, 145, 0, 0.329);
                border-radius: 4px;
                width:25%;
                font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            }
            #fall{
                width:200px; 
                border-radius: 4px;
            }
        </style>
    </head>
    <body>
        <h1>Advanced HTML Notes</h1>
        <h3>Lists:</h3>
        <ol type="a">
            <li> the first thing</li>
            <li> the second thing</li>
            <li>the third thing</li>
        </ol>
        <ul>
            <li id="even">apple</li>
            <li>banana</li>
            <li>orange</li>
            <li>kiwi</li>
        </ul>
        <dl>
            <dt>Fall</dt>
            <dd>Halloween</dd>
            <dd>Thanksgiving</dd>
            <dt>Winter</dt>
            <dd>Christmas</dd>
            <dd> Haukkah</dd>
            <dd>New Years</dd>
        </dl>

        <h3>Attributes:</h3>
        <a href="https://www.alltrails.com/trail/us/utah/mt-timpanogos-timpooneke-trail" target="_blank">
        <img src="https://globalsummitguide.com/wp-content/uploads/2026/07/AdobeStock_1146206325-scaled.jpeg" alt="Mount Timp" width="200px">
        <div>
        <img src="mount_timp.jpg" alt="timp part 2" id="fall">
        <p>Image from <a href="https://www.flickr.com/photos/a4gpa/3079988346/" target="_blank"> Flickr </a></p>
            </div>
    </body>
</html>
